name: Rumblestrip approval

# The owner's approval re-runs the review sheet's job of rumblestrip.yml's run on
# the approved commit, then the check and the merge after it.

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  approval:
    name: Approval
    permissions:
      actions: write # re-run the review sheet's job
      statuses: read # the owner's approval status
    uses: McReaper/rumblestrip-go/.github/workflows/rumblestrip-approval.yml@6e37982a5725b28f82c79f552cc895220102d685 # 6e37982a5725b28f82c79f552cc895220102d685
